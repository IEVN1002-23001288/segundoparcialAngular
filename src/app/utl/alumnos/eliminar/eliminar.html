<div class="min-h-screen flex justify-center items-center bg-slate-50 p-4">
  <div class="max-w-md w-full bg-white p-6 rounded-xl shadow border">
    <h2 class="text-2xl font-bold text-slate-800 mb-5">Eliminar Alumno</h2>
    <p class="mb-6">¿Deseas eliminar el registro con matrícula <strong>{{ matricula }}</strong>?</p>
    <div class="flex gap-3">
      <button type="button" (click)="eliminar()" [disabled]="eliminando || !matricula" class="bg-red-600 hover:bg-red-700 disabled:opacity-50 text-white px-5 py-2.5 rounded-lg">{{ eliminando ? 'Eliminando...' : 'Confirmar eliminación' }}</button>
      <button type="button" [routerLink]="['/utl/alumnos']" class="bg-slate-200 px-5 py-2.5 rounded-lg">Cancelar</button>
    </div>
  </div>
</div>
