<br><br>
<div class="max-w-2xl mx-auto p-6 bg-blue-300 rounded-lg shadow">
  <h1 class="text-3xl font-bold text-gray-900 mb-6">Cinepolis</h1>
  <form [formGroup]="formulario" >
    <!-- Nombre -->
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribir nombre"
      />
    </div>
    <!-- Cantidad -->
    <div class="mb-5">
      <label for="cantidad" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad Compradores
      </label>
 
      <input
        type="number"
        id="cantidad"
        name="cantidad"
     formControlName="cantidad"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Cantidad Compradores"
      />
    </div>
    <!-- correo -->
    <div class="mb-5">
      <label for="tarjeta" class="block mb-2 text-sm font-medium text-gray-900">
        Tarjeta cineco
      </label>
 
      <input 
        type="radio"
        value="si"
        id="si"
        name="tarjeta"
     formControlName="tarjeta"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
      />
      Si
      <input
        type="radio"
        value="no"
        id="no"
        name="tarjeta"
     formControlName="tarjeta"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5"
      />No
    </div>
    <!-- materia -->
    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">
        Cantidad de Boletos
      </label>
 
      <input
        type="number"
        id="boletos"
        name="boletos"
          formControlName="boletos"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Escribir cantidad boletos"
      />
    </div>
    <div class="flex justify-center mt-5">
        <button
          type="submit"
          (click)="muestraCinepolis()"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Procesar
        </button>
      </div>
    <div class="flex justify-center mt-5">
        <button
          type="button"
          routerLink="/Escuela/ver-registros"
          class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Ver Registros
        </button>
      </div>

     
      
  </form>

  
  <h1 class="text-3xl">Salidas</h1>
  <h2>Nombre Comprador: {{nuevoCinepolis.nombre}}</h2>
  <h2>Cantidad Compradores: {{nuevoCinepolis.cantidad}}</h2>
  <h2>Tarjeta Cineco: {{nuevoCinepolis.tarjeta}}</h2>
  <h2>Boletos Comprados: {{nuevoCinepolis.boletos}}</h2>
  <h2>Total a Pagar: {{nuevoCinepolis.Pagar}}</h2>
  <h2>{{nuevoCinepolis.error}}</h2>
</div>
