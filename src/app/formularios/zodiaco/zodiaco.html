<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>
<body>
     <form>
          <h1>Datos Personales</h1>
          <label for="nombre">nombre</label>
          <input [(ngModel)]="nombre" type="text" name="nombre" placeholder="Ingresa tu Nombre">
          <br><br>
          <label for="Apaterno">Apaterno</label>
          <input [(ngModel)]="Apaterno" type="text" name="Apaterno" placeholder="Ingresa tu Apellido Paterno">
          <br><br>
          <label for="Amaterno">Amaterno</label>
          <input [(ngModel)]="Amaterno" type="text" name="Amaterno" placeholder="Ingresa tu Apellido Materno">
          <br>
          <h2>Fecha de Nacimiento</h2>
          <label for="dia">dia</label>
          <input [(ngModel)]="dia" type="number" name="dia" placeholder="Ingresa tu dia">
          <label for="mes">mes</label>
          <input [(ngModel)]="mes" type="number" name="mes" placeholder="Ingresa tu mes">
          <label for="ano">año</label>
          <input [(ngModel)]="ano" type="number" name="ano" placeholder="Ingresa tu año">
          <br>
          <h3>Sexo</h3>
          <label>Masculino</label>
          <input [(ngModel)]="Sexo" type="radio" name="Sexo" value="Masculino">
          <label>Femenino</label>
          <input [(ngModel)]="Sexo" type="radio" name="Sexo" value="Femenino">
          <br><br>
          <button (click)="calcularZodiaco()" type="button">Imprimir</button>
          <br><br>
          <div [hidden]="!muestraImage">
               <h2>Hola {{nombre}} {{Apaterno}} {{Amaterno}}</h2>
               <h3>Tienes {{anoActual - ano}} años</h3>
               <h3>Sexo: {{Sexo}}</h3>
               <h3>Tu signo zodiacal es {{zodiaco}}</h3>
               <img [src]="imagen" [style.width.px]="imageWidth" [style.margin.px]="imageMargin">
          </div>
          <!-- <h2>{{resultado}}</h2>
          <img [hidden]='!muestraImage' [src]="imagen"
               [style.width.px]="imageWidth"
               [style.margin.px]="imageMargin"> -->
     </form>
</body>
</html>
